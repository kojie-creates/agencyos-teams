      <path d="M1120 375H1150" stroke="url(#violet)" stroke-width="4" stroke-linecap="round"/>
      <path d="M790 430V490" stroke="url(#violet)" stroke-width="4" stroke-linecap="round"/>
      <path d="M1020 430V490" stroke="url(#violet)" stroke-width="4" stroke-linecap="round"/>
      <path d="M1250 430V490" stroke="url(#violet)" stroke-width="4" stroke-linecap="round"/>
      <path d="M890 545H920" stroke="url(#teal)" stroke-width="4" stroke-linecap="round"/>
